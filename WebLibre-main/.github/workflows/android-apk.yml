name: Android APK Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/weblibre/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/weblibre/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build one signed stable arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI_KEY_ALIAS: weblibre-github-actions
      CI_KEYSTORE_PASSWORD: weblibre-github-actions
      FLUTTER_VERSION: "3.41.6"
      JAVA_VERSION: "17"

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache-1
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore Flutter and Dart cache
        id: dart-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .melos_tool
            apps/weblibre/.dart_tool
            packages/*/.dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Show cache status
        run: |
          echo "Gradle cache hit: ${{ steps.gradle-cache.outputs.cache-hit }}"
          echo "Flutter/Dart cache hit: ${{ steps.dart-cache.outputs.cache-hit }}"

      - name: Create GitHub Actions signing keys
        env:
          KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weblibre-keystores" "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/weblibre-keystores/release.jks" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=WebLibre GitHub Actions, OU=CI, O=WebLibre, L=CI, ST=CI, C=US"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, OU=Android, O=Android, L=CI, ST=CI, C=US"

      - name: Validate repository structure
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f apps/weblibre/pubspec.yaml
          test -f apps/weblibre/android/app/build.gradle
          test -f packages/flutter_mozilla_components/pubspec.yaml
          test -d apps/weblibre/lib
          test -d packages/flutter_mozilla_components/android
          conflicts="$(git ls-files | python3 -c 'import sys, collections; d=collections.defaultdict(list); [d[line.strip().lower()].append(line.strip()) for line in sys.stdin if line.strip()]; print("\n".join(" | ".join(v) for v in d.values() if len(v) > 1))')"
          if [ -n "$conflicts" ]; then
            echo "Case-conflicting paths detected:"
            echo "$conflicts"
            exit 1
          fi

      - name: Bootstrap workspace
        run: |
          set -euo pipefail
          dart pub global activate melos
          dart pub global activate dependency_validator
          melos bootstrap

      - name: Run CLI checks
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed .
          melos run validate-dependencies --no-select
          melos run build --no-select
          flutter analyze apps/weblibre

      - name: Detect generated source drift
        run: git diff --exit-code -- apps packages pubspec.lock

      - name: Update external assets
        run: melos run update-assets --no-select

      - name: Build components
        run: melos run build-components --no-select

      - name: Build stable arm64 release APK
        working-directory: apps/weblibre
        env:
          KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          KEY_PATH: ${{ runner.temp }}/weblibre-keystores/release.jks
        run: flutter build apk --release --flavor stable --target-platform android-arm64 --no-tree-shake-icons

      - name: Collect APK outputs
        run: |
          set -euo pipefail
          project_name="WebLibre"
          version="$(python3 -c 'import pathlib,re; text=pathlib.Path("apps/weblibre/pubspec.yaml").read_text(); print(re.search(r"^version:\s*(\S+)", text, re.M).group(1).replace("+", "-"))')"
          build_number="${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}"
          apk="apps/weblibre/build/app/outputs/flutter-apk/app-stable-release.apk"
          test -f "$apk"
          mkdir -p artifacts/apk
          cp "$apk" "artifacts/apk/${project_name}-${version}-${build_number}-stable-arm64-release.apk"
          ls -la artifacts/apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: WebLibre-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Flutter and Dart cache
        if: always() && steps.dart-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .melos_tool
            apps/weblibre/.dart_tool
            packages/*/.dart_tool
          key: ${{ steps.dart-cache.outputs.cache-primary-key }}
