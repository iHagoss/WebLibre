//Required by background_fetch build
ext {
    compileSdkVersion   = 37
    targetSdkVersion    = 37
}

buildscript {
    ext.kotlin_version = '2.3.21'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //Required by background_fetch build
        maven { url "${project(':background_fetch').projectDir}/libs" }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.glance') {
                details.useVersion '1.1.1'
                details.because 'Glance 1.3.0-alpha01 requires AGP 9.x, while Flutter CI currently uses AGP 8.13.2.'
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate {
        if (it.hasProperty("android")) {
            android {
                compileSdkVersion 37
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
